<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbound Spectator</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root {
  --bg: #0b0f14; --panel: #12181f; --tile: #19212a; --line: #232c37; --text: #d6dde6; --dim: #7d8895; --faint: #4f5a67;
  --main: #6cb6ff; --sonnet: #c9a0ff; --opus: #ff9e64; --fable: #7ee0b5;
  --read: #39c5cf; --write: #f2cc60; --good: #56d364; --warn: #e3b341; --bad: #f47067;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gap: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13.5px/1.5 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
header { height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 calc(var(--gap) + 4px); white-space: nowrap; }
header b { font-size: 15px; letter-spacing: .02em; }
header .k { color: var(--dim); margin-right: 4px; }
header .grow { flex: 1; }
.tag { font: 11px var(--mono); padding: 2px 8px; border-radius: 9px; border: 1px solid var(--line); color: var(--dim); }
.tag.live { color: var(--good); border-color: #2e5f38; }
select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }

/* Layout: two columns. Left: the reasoning stream (scrolls) over the router. Right: trainer & party on top,
   memory map beside the learnings list below. Panels are separated by space, not borders. */
main { height: calc(100% - 48px); display: grid; grid-template-columns: minmax(340px, 2fr) minmax(0, 3fr);
  gap: var(--gap); padding: 0 var(--gap) var(--gap); }
.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0; }
.pair { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(250px, 2fr); gap: var(--gap); }
section { background: var(--panel); border-radius: 10px; display: flex; flex-direction: column;
  min-width: 0; min-height: 0; position: relative; }
#reason { flex: 1; }
h2 { margin: 0; padding: 11px 16px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .09em; color: var(--dim); display: flex; gap: 10px; align-items: baseline; }
h2 .note { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); margin-left: auto; font-size: 11.5px; }
.scroll { overflow-y: auto; flex: 1; padding: 0 16px 12px; }
.scroll::-webkit-scrollbar, #learns::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb, #learns::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

/* reasoning */
#feed .txt { margin: 10px 0; white-space: pre-wrap; }
#feed .tool { font: 12px/1.45 var(--mono); color: var(--dim); margin: 3px 0; padding-left: 10px; border-left: 2px solid var(--line); }
#feed .tool .n { color: #a5b4c4; }
#feed .tool .r { color: var(--good); } #feed .tool .r.err { color: var(--bad); }
#feed .spawn { font: 12px var(--mono); margin: 6px 0; padding-left: 10px; border-left: 2px solid var(--sonnet); color: var(--sonnet); }
.time { color: var(--faint); font: 10px var(--mono); margin-right: 6px; }
#paused { display: none; color: var(--warn); text-transform: none; letter-spacing: 0; }

/* activity pill (#132): what the agent is doing between actions */
.act { font-size: 12.5px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: #151c25;
  max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: border-color .3s, color .3s; }
.act.read { border-color: var(--read); color: var(--read); } .act.write { border-color: var(--write); color: var(--write); }
.act.wait { border-color: var(--warn); color: var(--warn); } .act.play { color: var(--good); border-color: #2c5a3a; }
.act.think { color: var(--dim); } .act.idle { opacity: .6; }

/* router: harness checks on the left, the main agent in the middle, its subagents on the right */
#router svg { display: block; width: 100%; height: auto; max-height: 190px; padding: 0 12px; }
.node rect { fill: var(--tile); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s, fill .2s; }
.node text { fill: var(--text); font-size: 14px; font-weight: 600; } .node .sub { fill: var(--dim); font-size: 11px; font-weight: 400; }
.node.hot rect { fill: #232c39; }
.glabel { fill: var(--faint); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.edge { fill: none; stroke: #2a3441; stroke-width: 2; transition: stroke .3s; }
.edge.active { stroke-dasharray: 5 4; animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -18; } }
#counts { display: flex; gap: 6px 16px; padding: 6px 16px 4px; font: 12px var(--mono); color: var(--dim); flex-wrap: wrap; }
#counts span b { font-weight: 600; }
#trail { padding: 0 16px 12px; font: 11.5px/1.6 var(--mono); color: var(--dim); }
#trail div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#trail .trig { color: var(--warn); } #trail .back { color: var(--good); }

/* trainer stats: tiles sized by their content (no stretching, so no dead space) */
#stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px 12px; }
#stats > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 9px 12px 10px;
  background: var(--tile); border-radius: 8px; }
#stats .k { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }
#stats b { font-weight: 600; font-size: 17px; line-height: 1.35; padding-bottom: .1em; overflow: hidden; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }  /* wrap long values, e.g. a map name */
#stats .sm { color: var(--faint); font: 11px/1.4 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#stats .badge { width: 11px; height: 11px; margin: 0 3px 3px 0; }
.badge { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--faint); margin-right: 3px; vertical-align: -1px; }
.badge.on { background: var(--write); border-color: var(--write); }

/* party */
#foe:empty { display: none; }
#foe { display: grid; grid-template-columns: auto 1fr 70px; gap: 12px; align-items: center; margin: 0 16px 10px; padding: 8px 12px;
  border-radius: 8px; background: #2a1719; box-shadow: inset 3px 0 var(--bad); font-size: 13.5px; }
#foe .nm { color: var(--bad); font-weight: 600; } #foe .sp { color: var(--dim); }
#mons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 16px 14px; }
.mon { display: flex; flex-direction: column; gap: 5px; padding: 9px 12px 10px; border-radius: 8px; background: var(--tile); min-width: 0; }
.mon .l1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.mon .l1 .who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.mon .nm { font-weight: 600; font-size: 15px; } .mon .sp { color: var(--dim); font-size: 12.5px; }
.mon.lead { box-shadow: inset 3px 0 var(--main); }
.mon.lead .nm::before { content: "▸ "; color: var(--main); }
.mon.is-partner { opacity: .6; outline: 1px dashed var(--line); } .st.partner { color: var(--dim); background: var(--line); }
.mon .l3 { display: flex; justify-content: space-between; gap: 8px; font: 10.5px var(--mono); color: var(--faint); min-width: 0; }
.mon .it { display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: system-ui, "Segoe UI", sans-serif; font-size: 11.5px; color: var(--dim); }
.mon .l3 .xpt { white-space: nowrap; }
.bar { height: 7px; background: #262f3a; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; transition: width .5s, background .5s; }
.bar.xp { height: 3px; } .bar.xp i { background: var(--main); }
.hp { font: 12.5px var(--mono); color: var(--dim); text-align: right; white-space: nowrap; }
.st { font: 10px var(--mono); padding: 1px 5px; border-radius: 3px; background: #3a2a1e; color: var(--opus); white-space: nowrap; }

/* memory */
#graph { flex: 1; min-height: 0; }
#legend { padding: 4px 16px 12px; font: 10px var(--mono); color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 10px; pointer-events: none; }
#legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
#toasts { position: absolute; right: 12px; top: 40px; width: min(340px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: #1f2a1f; border: 1px solid #2e5f38; border-left: 3px solid var(--good); border-radius: 6px;
  padding: 8px 10px; box-shadow: 0 6px 20px #0008; animation: pop .35s ease-out; transition: opacity .6s, transform .6s; }
.toast .h { font: 10px var(--mono); color: var(--good); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.toast.out { opacity: 0; transform: translateX(30px); }
@keyframes pop { from { opacity: 0; transform: translateY(-10px) scale(.97); } }

/* learnings: newest first, three lines each, click to read the whole entry */
#learns { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 16px 14px; }
#learn .item { flex: 0 0 auto; padding: 8px 11px; border-radius: 8px; background: var(--tile); font-size: 12.5px; line-height: 1.45; cursor: pointer; }
#learn .item .tx { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: .1em; }
#learn .item.open .tx { -webkit-line-clamp: unset; }
#learn .meta { font: 10px var(--mono); color: var(--faint); margin-bottom: 2px; }
#learn .item.new { animation: glow 3s ease-out; }
@keyframes glow { from { background: #1f3322; } }

/* narrower than a side-by-side window: tighter right column, then one scrolling column */
@media (max-width: 1150px) { .pair { grid-template-columns: minmax(0, 1fr) minmax(220px, 1fr); } }
@media (max-width: 860px) {
  html, body { overflow: auto; height: auto; }
  main { height: auto; grid-template-columns: minmax(0, 1fr); }
  #reason { height: 60vh; flex: none; } #stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pair { grid-template-columns: minmax(0, 1fr); }
  #memory { height: 55vh; } #learn { max-height: 45vh; }
  header { flex-wrap: wrap; height: auto; padding: 8px 16px; } .act { max-width: 100%; }
}
</style>
</head>
<body>
<header>
  <b>Unbound Spectator</b>
  <span id="mode" class="tag">connecting</span>
  <span id="speedbox" hidden><span class="k">speed</span><select id="speed">
    <option>1</option><option>5</option><option>20</option><option>60</option><option>200</option></select></span>
  <span id="act" class="act idle" title="what the agent is doing right now">waiting for activity</span>
  <span class="grow"></span>
  <span id="gmode" class="tag">-</span>
  <span id="src" class="tag">-</span>
</header>
<main>
  <div class="col">
    <section id="reason">
      <h2>Claude's reasoning <span id="paused">paused</span><span class="note">main agent</span></h2>
      <div class="scroll" id="feed"></div>
    </section>
    <section id="router">
      <h2>Model router</h2>
      <svg viewBox="0 0 516 168" preserveAspectRatio="xMidYMid meet">
        <text class="glabel" x="4" y="10">harness</text><text class="glabel" x="512" y="10" text-anchor="end">subagents</text>
        <g id="edges"></g><g id="nodes"></g><g id="pulses"></g>
      </svg>
      <div id="counts"></div>
      <div id="trail"></div>
    </section>
  </div>
  <div class="col">
    <section id="party">
      <h2>Trainer &amp; party <span class="note" id="partyage"></span></h2>
      <div id="stats"></div>
      <div id="foe"></div>
      <div id="mons"></div>
    </section>
    <div class="pair">
      <section id="memory">
        <h2>Memory map <span class="note" id="gstats"></span></h2>
        <div id="graph"></div>
        <div id="legend"></div>
        <div id="toasts"></div>
      </section>
      <section id="learn">
        <h2>Learned something new <span class="note" id="lcount"></span></h2>
        <div id="learns"></div>
      </section>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const hhmm = t => t ? new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- reasoning */
const feed = $("feed"); let hover = false; const toolRows = {};
feed.addEventListener("mouseenter", () => { hover = true; $("paused").style.display = "inline"; });
feed.addEventListener("mouseleave", () => { hover = false; $("paused").style.display = "none"; feed.scrollTop = feed.scrollHeight; });
function add(el) {
  feed.appendChild(el);
  while (feed.childElementCount > 600) feed.firstElementChild.remove();
  if (!hover) feed.scrollTop = feed.scrollHeight;
}
function div(cls, html) { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; return d; }

/* ---------- router */
const AG = {
  main: {x: 196, y: 71, label: "Haiku 5.5", sub: "main", color: "--main"},
  watcher: {x: 4, y: 20, label: "Haiku 5.5", sub: "watcher", color: "--main"},
  verifier: {x: 4, y: 71, label: "Sonnet 5.5", sub: "verifier", color: "--sonnet"},
  curator: {x: 4, y: 122, label: "Sonnet 5.5", sub: "curator", color: "--sonnet"},
  strategist: {x: 388, y: 20, label: "Opus 5.5", sub: "strategist", color: "--opus"},
  refiner: {x: 388, y: 71, label: "Opus 5.5", sub: "refiner", color: "--opus"},
  expert: {x: 388, y: 122, label: "Fable 5.1", sub: "expert", color: "--fable"},
};
const W = 124, H = 42, spawnN = {}, edgeTimers = {};
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
function edgePath(a) {
  const m = AG.main, s = AG[a], d = s.x > m.x ? 1 : -1;  // subagents to the right, harness checks to the left
  const x1 = m.x + (d > 0 ? W : 0), y1 = m.y + H / 2, x2 = s.x + (d > 0 ? 0 : W), y2 = s.y + H / 2;
  return `M${x1},${y1} C${x1 + 30 * d},${y1} ${x2 - 30 * d},${y2} ${x2},${y2}`;
}
for (const [k, a] of Object.entries(AG)) {
  const g = svgEl("g", {class: "node", id: "n-" + k}, $("nodes"));
  svgEl("rect", {x: a.x, y: a.y, width: W, height: H, rx: 8, style: `stroke:${css(a.color)}55`}, g);
  svgEl("text", {x: a.x + 10, y: a.y + 18}, g).textContent = a.label;
  const sub = svgEl("text", {x: a.x + 10, y: a.y + 33, class: "sub", id: "s-" + k}, g); sub.textContent = a.sub;
  if (k !== "main") {
    svgEl("path", {d: edgePath(k), class: "edge", id: "e-" + k}, $("edges"));
  }
}
function hot(k, color) {
  const r = document.querySelector(`#n-${k} rect`); if (!r) return;
  r.style.stroke = color; document.getElementById("n-" + k).classList.add("hot");
  clearTimeout(r._t); r._t = setTimeout(() => { r.style.stroke = css(AG[k].color) + "55"; document.getElementById("n-" + k).classList.remove("hot"); }, 1600);
}
function pulse(agent, back) {
  if (!AG[agent]) agent = "strategist";
  const color = css(AG[agent].color);
  const c = svgEl("circle", {r: 5, fill: color, style: `filter:drop-shadow(0 0 5px ${color})`}, $("pulses"));
  const am = svgEl("animateMotion", {dur: "0.9s", fill: "freeze", path: edgePath(agent), ...(back ? {keyPoints: "1;0", keyTimes: "0;1", calcMode: "linear"} : {})}, c);
  am.beginElement(); setTimeout(() => c.remove(), 1000);
  setTimeout(() => hot(back ? "main" : agent, color), 850);
  const e = $("e-" + agent);
  e.style.stroke = color;
  clearTimeout(edgeTimers[agent]);
  if (!back) { e.classList.add("active"); edgeTimers[agent] = setTimeout(() => settle(agent), 90000); }
  else settle(agent, 2500);
}
function settle(agent, after = 0) {
  setTimeout(() => { const e = $("e-" + agent); e.classList.remove("active"); e.style.stroke = ""; }, after);
}
const trailRows = {};
function onSpawn(ev, quiet) {
  const a = AG[ev.agent] ? ev.agent : "strategist";
  spawnN[a] = (spawnN[a] || 0) + 1;
  $("s-" + a).textContent = `${AG[a].sub} · ×${spawnN[a]}`;
  const row = div("", `<span class="time">${hhmm(ev.t)}</span><span class="trig">${esc(ev.trigger)}</span> → ${esc(ev.agent)}: ${esc(ev.desc)}`);
  row.title = row.textContent;
  trailRows[ev.id] = row; $("trail").prepend(row);
  while ($("trail").childElementCount > 3) $("trail").lastElementChild.remove();
  add(div("spawn", `<span class="time">${hhmm(ev.t)}</span>⇢ ${esc(ev.agent)} <span style="color:var(--warn)">[${esc(ev.trigger)}]</span> ${esc(ev.desc)}`));
  if (!quiet) pulse(a, false);
}
function onReturn(ev, quiet) {
  const row = trailRows[ev.id];  // the answer is in the reasoning feed; the router only marks the handoff done
  if (row) { row.insertAdjacentHTML("afterbegin", `<span class="back">✓ </span>`); row.title += `
← ${ev.text}`; }
  add(div("spawn", `<span class="time">${hhmm(ev.t)}</span>⇠ ${esc(ev.agent)}: ${esc(ev.text)}`));
  if (!quiet) pulse(ev.agent, true);
}
const MODEL = {haiku: "--main", sonnet: "--sonnet", opus: "--opus", fable: "--fable"};
function onCounts(c) {
  $("counts").innerHTML = Object.entries(c).sort((a, b) => b[1] - a[1]).map(([m, n]) => {
    const fam = Object.keys(MODEL).find(f => m.includes(f));
    const name = m.replace(/^claude-/, "").replace(/-(\d+)-(\d+)$/, " $1.$2");
    return `<span style="color:${fam ? css(MODEL[fam]) : "inherit"}">${esc(name)} <b>${n}</b></span>`;
  }).join("") + `<span>msgs</span>`;
}

/* ---------- party */
function hpbar(hp) {
  const [a, b] = String(hp || "0/0").split("/").map(Number), f = b ? a / b : 0;
  const col = f > .5 ? "--good" : f > .2 ? "--warn" : "--bad";
  return `<div class="bar"><i style="width:${(f * 100).toFixed(0)}%;background:var(${col})"></i></div>`;
}
let partyT = 0, party = null, stats = null;
const dur = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${String(Math.floor(s / 60) % 60).padStart(2, "0")}m` : `${Math.floor(s / 60)}m`;
function drawStats() {
  const s = party || {}, r = stats;
  const map = s.map && typeof s.map === "object" ? s.map.name : s.map;
  const cell = (k, v, sm = "") => `<div><span class="k">${k}</span><b>${v}</b>${sm ? `<span class="sm">${sm}</span>` : ""}</div>`;
  const badges = s.badges != null ? Array.from({length: 8}, (_, i) => `<i class="badge${i < s.badges ? " on" : ""}"></i>`).join("") : "-";
  const tok = r ? Object.entries(r.tokens).map(([m, n]) => `${m.replace(/^claude-|-\d+-\d+$/g, "")} ${(n / 1000).toFixed(0)}k`).join(" · ") : "";
  $("stats").innerHTML =
    cell("Location", esc(map || "-"), s.pos ? `(${s.pos.join(", ")})` : "") +
    cell("Badges", badges, s.badges != null ? `${s.badges} / 8` : "") +
    cell("Money", s.money != null ? "₽" + s.money.toLocaleString() : "-") +
    cell("Pokédex", s.dex_owned != null ? `${s.dex_owned} caught` : "-", r ? `${r.catches.length} caught this run` : "") +
    cell("Play time", s.playtime ? `${s.playtime[0]}h ${String(s.playtime[1]).padStart(2, "0")}m` : "-", "in-game clock") +
    cell("Run time", r && r.first ? dur(r.last - r.first) : "-", r ? `${r.actions.toLocaleString()} agent actions` : "") +
    cell("Cost", r ? "$" + r.cost.toFixed(2) : "-", r ? `${r.costed}/${r.chunks} chunks reported` : "") +
    cell("Output tokens", r ? Object.values(r.tokens).reduce((a, b) => a + b, 0).toLocaleString() : "-", tok);
  $("stats").lastElementChild.title = tok;  // the per-model split can be longer than the tile
}
function onParty(s) {
  if (!s) return;
  partyT = s.src === "bridge" ? 0 : s.t;
  $("partyage").textContent = s.src === "bridge" ? "live, read-only bridge" : s.src === "mock" ? "mock data" : "";
  party = s; drawStats();
  $("gmode").textContent = s.mode || "-";
  $("src").textContent = s.src === "bridge" ? "bridge :live" : s.src === "mock" ? "mock data" : "log.jsonl";
  $("src").className = "tag" + (s.src === "bridge" ? " live" : "");
  let html = "";
  const foes = (s.battle?.battlers || []).filter(b => b.side === "opponent");
  $("foe").innerHTML = foes.map(f => `<div><span class="nm">Foe ${esc(f.name)}</span> <span class="sp">${f.species !== f.name ? esc(f.species) + " " : ""}Lv${f.level} · ${esc((f.types || []).join("/"))}</span>${f.status ? `<span class="st">${esc(f.status)}</span>` : ""}</div>${hpbar(f.hp)}<div class="hp">${esc(f.hp)}</div>`).join("");
  const lead = (s.party || []).findIndex(p => +String(p.hp).split("/")[0] > 0);
  (s.party || []).forEach((p, i) => {
    const sp = p.species ? `${esc(p.species)}${p.level ? " Lv" + p.level : ""}` : "";
    const togo = p.exp ? `${p.exp[1] - p.exp[0]} EXP to go` : "";
    const xp = p.exp ? `<div class="bar xp" title="${togo}"><i style="width:${(100 * p.exp[0] / p.exp[1]).toFixed(0)}%"></i></div>` : "";
    const it = p.item ? `<span title="held item">${esc(p.item)}</span>` : "";
    const st = p.status ? `<span class="st">${esc(p.status)}</span>` : "";
    const pt = p.partner ? `<span class="st partner">partner</span>` : "";  // an NPC partner's Pokemon, battle only
    html += `<div class="mon${i === lead ? " lead" : ""}${p.partner ? " is-partner" : ""}">` +
      `<div class="l1"><span class="who" title="${esc(p.name)} ${esc(sp)}"><span class="nm">${esc(p.name)}</span> <span class="sp">${p.species !== p.name ? sp : (p.level ? "Lv" + p.level : "")}</span></span><span class="hp">${esc(p.hp)}</span></div>` +
      `${hpbar(p.hp)}${xp}<div class="l3"><span class="it">${st}${pt}${it}</span><span class="xpt">${togo}</span></div></div>`;
  });
  $("mons").innerHTML = html || `<div style="color:var(--faint);padding:8px 0">no party data yet</div>`;
}
setInterval(() => { if (partyT) $("partyage").textContent = `updated ${Math.max(0, Math.round(Date.now() / 1000 - partyT))}s ago`; }, 1000);

/* ---------- memory graph */
const TYPE = {file: ["#e6edf3", "memory file"], map: ["#6cb6ff", "map"], species: ["#7ee0b5", "species"],
  nick: ["#ff9e64", "nickname"], npc: ["#c9a0ff", "npc/trainer"], mission: ["#f2cc60", "mission"], link: ["#f47067", "[[link]]"]};
$("legend").innerHTML = Object.values(TYPE).map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("");
const nodes = new vis.DataSet(), edges = new vis.DataSet();
const net = new vis.Network($("graph"), {nodes, edges}, {
  nodes: {shape: "dot", font: {color: "#aeb8c4", size: 11, face: "system-ui"}, borderWidth: 0},
  edges: {color: {color: "#2a3441", highlight: "#6cb6ff"}, width: 1, smooth: false},
  // Settle once, off screen, then freeze: physics only ever runs inside stabilize() (#98: it used to spin).
  physics: {solver: "forceAtlas2Based", forceAtlas2Based: {gravitationalConstant: -30, centralGravity: .03, springLength: 45,
    damping: .9, avoidOverlap: .3}, stabilization: {iterations: 300, fit: true}, maxVelocity: 20, minVelocity: 1},
  interaction: {hover: true, tooltipDelay: 150},
});
let settled = false;
net.on("stabilizationIterationsDone", () => {
  net.setOptions({physics: {enabled: false}});
  nodes.update(nodes.getIds().map(id => ({id, fixed: false})));  // unpin the nodes a local settle pinned
  // Refit after every settle: the first one can run on a tiny early graph, and the view then stayed zoomed onto
  // it while later nodes landed off screen (the map looked empty with 122 nodes).
  net.fit();
  settled = true;
});
new ResizeObserver(() => { net.redraw(); net.fit(); }).observe($("graph"));  // the panel resizes with the window
function settleNew(fresh) {
  // Place each new node next to a linked node, pin everything else, run a short damped settle, freeze again.
  for (const id of fresh) {
    const e = edges.get({filter: x => (x.from === id || x.to === id) && !fresh.includes(x.from === id ? x.to : x.from)})[0];
    const p = e && net.getPosition(e.from === id ? e.to : e.from);
    if (p) nodes.update({id, x: p.x + (Math.random() - .5) * 60, y: p.y + (Math.random() - .5) * 60});
  }
  nodes.update(nodes.getIds().filter(id => !fresh.includes(id)).map(id => ({id, fixed: true})));
  net.setOptions({physics: {enabled: true}});
  net.stabilize(60);
}
function nodeStyle(n, deg) {
  const c = TYPE[n.type]?.[0] || "#888", file = n.type === "file";
  return {id: n.id, label: n.label, title: `${TYPE[n.type]?.[1] || n.type}: ${n.label}`,
    size: file ? 16 + Math.min(deg, 30) * .4 : 5 + Math.min(deg, 6) * 1.5,
    color: {background: c, border: c, highlight: {background: "#fff", border: "#fff"}},
    font: file ? {color: "#e6edf3", size: 13, bold: true} : {color: "#8b96a3", size: 10}, base: c};
}
let firstGraph = true;
function onGraph(g) {
  const deg = {};
  g.edges.forEach(([a, b]) => { deg[a] = (deg[a] || 0) + 1; deg[b] = (deg[b] || 0) + 1; });
  const fresh = g.nodes.filter(n => !nodes.get(n.id)).map(n => n.id);
  nodes.update(g.nodes.map(n => nodeStyle(n, deg[n.id] || 0)));
  const want = new Set(g.nodes.map(n => n.id));
  nodes.remove(nodes.getIds().filter(id => !want.has(id)));
  const eids = g.edges.map(([a, b]) => a + "|" + b), ewant = new Set(eids);
  edges.update(g.edges.filter(([a, b]) => !edges.get(a + "|" + b)).map(([a, b]) => ({id: a + "|" + b, from: a, to: b})));
  edges.remove(edges.getIds().filter(id => !ewant.has(id)));
  $("gstats").textContent = `${g.nodes.filter(n => n.type === "file").length} files · ${g.nodes.length} nodes · ${g.edges.length} links`;
  if (!settled && g.nodes.length) net.stabilize(300);  // the first layout, computed without animating
  else if (!firstGraph && fresh.length) {
    if (settled) settleNew(fresh);
    fresh.forEach(id => flash(id, "#56d364", 2500));
  }
  firstGraph = false;
}
const flashT = {};
function flash(id, color, ms = 1500) {
  const n = nodes.get(id); if (!n) return;
  nodes.update({id, color: {background: color, border: color}, borderWidth: 3, shadow: {enabled: true, color, size: 18, x: 0, y: 0}});
  clearTimeout(flashT[id]);
  flashT[id] = setTimeout(() => nodes.get(id) && nodes.update({id, color: {background: n.base, border: n.base}, borderWidth: 0, shadow: {enabled: false}}), ms);
}
function onMem(ev) {
  const color = ev.op === "write" ? css("--write") : css("--read");
  flash("file:" + ev.file, color, ev.op === "write" ? 2200 : 1400);
  (ev.ents || []).forEach(id => flash(id, color, 1800));
}

/* ---------- learnings */
let nLearn = 0;
function onLearn(ev, quiet) {
  nLearn++; $("lcount").textContent = `${nLearn}`;
  const src = ev.who === "refiner" ? "refiner" : ev.who === "file" ? "learnings.md" : ev.who === "main" ? "agent" : ev.who;
  const item = div("item" + (quiet || ev.quiet ? "" : " new"), `<div class="meta">${hhmm(ev.t)} · ${esc(src)} · ${esc(ev.file)}</div><div class="tx">${esc(ev.text)}</div>`);
  item.title = ev.text; item.onclick = () => item.classList.toggle("open");
  const L = $("learns");
  L.prepend(item);
  while (L.childElementCount > 200) L.lastElementChild.remove();
  if (!quiet) L.scrollTop = 0;
  if (quiet || ev.quiet) return;
  const t = div("toast", `<div class="h">Learned something new · ${esc(src)}</div>${esc(ev.text.length > 220 ? ev.text.slice(0, 219) + "…" : ev.text)}`);
  $("toasts").prepend(t);
  while ($("toasts").childElementCount > 3) $("toasts").lastElementChild.remove();
  setTimeout(() => t.classList.add("out"), 6000); setTimeout(() => t.remove(), 6700);
}

/* ---------- activity */
let act = {t: 0, kind: "idle", what: ""}, reading = new Set();
const ICON = {read: "📖", write: "✍️", wait: "⇢", play: "🎮", think: "💭", other: "⚙️"};
function onAct(ev) {
  if (ev.kind !== "read") releaseReads();
  act = ev;
  if (ev.kind === "read" && ev.file) {  // hold the node lit while the agent is reading, not a 1 s flash
    reading.add("file:" + ev.file); flash("file:" + ev.file, css("--read"), 600000);
  }
  drawAct();
}
function releaseReads() { reading.forEach(id => flash(id, css("--read"), 400)); reading.clear(); }
function drawAct() {
  const el = $("act"), secs = Math.max(0, Math.round(Date.now() / 1000 - act.t));
  if (!act.t) return;
  const who = act.who && act.who !== "main" ? `${act.who}: ` : "";
  let kind = act.kind, what = act.what;
  if (kind === "think" || kind === "play") {  // between actions: after a few seconds it's thinking
    if (secs >= 5) { kind = "think"; what = "thinking"; }
  }
  el.className = "act " + kind;
  el.textContent = `${ICON[kind] || ""} ${who}${what}${secs >= 5 ? ` (${secs}s)` : ""}`;
  el.title = el.textContent;
}
setInterval(drawAct, 1000);

/* ---------- events */
function handle(ev, quiet) {
  switch (ev.k) {
    case "text": add(div("txt", `<span class="time">${hhmm(ev.t)}</span>${esc(ev.text)}`)); break;
    case "tool": { const d = div("tool", `<span class="time">${hhmm(ev.t)}</span><span class="n">${esc(ev.text)}</span>`); toolRows[ev.id] = d; add(d); break; }
    case "result": { const d = toolRows[ev.id]; if (d) { d.insertAdjacentHTML("beforeend", ` <span class="r${ev.err ? " err" : ""}">→ ${esc(ev.text)}</span>`); if (!hover) feed.scrollTop = feed.scrollHeight; } delete toolRows[ev.id]; break; }
    case "spawn": onSpawn(ev, quiet); break;
    case "return": onReturn(ev, quiet); break;
    case "mem": if (!quiet) onMem(ev); break;
    case "act": if (!quiet) onAct(ev); break;
    case "learn": onLearn(ev, quiet); break;
    case "graph": onGraph(ev.graph); break;
    case "party": onParty(ev.party); break;
    case "counts": onCounts(ev.counts); break;
    case "stats": stats = ev.stats; drawStats(); break;
  }
}
function connect() {
  const es = new EventSource("/events");
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.k !== "snapshot") return handle(ev, false);
    feed.innerHTML = ""; $("learns").innerHTML = ""; $("trail").innerHTML = ""; nLearn = 0;
    $("mode").textContent = ev.mode; $("mode").className = "tag" + (ev.mode === "live" ? " live" : "");
    $("speedbox").hidden = !ev.mode.startsWith("replay");
    if (ev.mode.startsWith("replay")) $("speed").value = ev.mode.split("x")[1];
    onGraph(ev.graph); stats = ev.stats; onParty(ev.party); drawStats(); onCounts(ev.counts);
    ev.events.forEach(e => handle(e, true));
  };
  es.onerror = () => { $("mode").textContent = "reconnecting"; $("mode").className = "tag"; };
}
$("speed").onchange = e => fetch("/speed?x=" + e.target.value);
connect();
</script>
</body>
</html>
